function classifyTransaction(txn) {

        return { debit: byId("394"), credit: DUE_TO_CV, note: "Legal fees via CV", conf: "high" };

        return { debit: byId("1665"), credit: DUE_TO_CV, note: "Audit/accounting fees", conf: "high" };

    if (/expo|conference|summit|convention/.test(raw))

    if (/highlevel|semrush|typeform|scribe|shopify|godaddy|duda|design pickle|acculynx/.test(raw))

        return { debit: DUE_TO_CV, credit: byId("1617"), note: "MSC/Malek loan repayment", conf: "medium" };

function searchCOA(query) {

}

        const s = String(cell !== null && cell !== undefined ? cell : "");
