<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401k Payroll Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            transition: background 0.3s;
        }
        :root {
            --bg: #f5f5f5;
            --text: #1a1a1a;
            --border: #ddd;
            --input-bg: white;
            --input-text: #333;
            --accent: #0066cc;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1e1e1e;
                --text: #e0e0e0;
                --border: #333;
                --input-bg: #2a2a2a;
                --input-text: #e0e0e0;
            }
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { margin-bottom: 20px; font-size: 24px; }
        .layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

        .main { }
        .sidebar { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; height: fit-content; }
        .sidebar h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; color: var(--accent); }
        .config-group { margin-bottom: 12px; }
        .config-group label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: 500; }
        .config-group input, .config-group select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--input-bg); color: var(--input-text); font-size: 12px; }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: var(--input-bg);
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        .drop-zone:hover { border-color: var(--accent); background: rgba(0,102,204,0.02); }
        .drop-zone.dragover { border-color: var(--accent); background: rgba(0,102,204,0.05); }
        .drop-zone p { margin: 10px 0 0; font-size: 13px; color: var(--text); }
        .drop-zone input { display: none; }

        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }
        .btn-secondary:hover { opacity: 0.8; }

        .employee-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
            font-size: 12px;
        }
        .employee-table thead {
            background: var(--border);
            font-weight: 600;
        }
        .employee-table th, .employee-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .employee-table tr:last-child td { border-bottom: none; }
        .employee-table input { width: 70px; padding: 4px; }
        .employee-status { font-size: 11px; }
        .status-ok { color: var(--success); }
        .status-missing { color: var(--danger); }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            animation: fadeIn 0.2s;
        }
        .modal.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: var(--input-bg);
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h2 { margin-bottom: 16px; font-size: 16px; }
        .modal-field { margin-bottom: 12px; }
        .modal-field label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
        .modal-field input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--input-bg); color: var(--input-text); font-size: 12px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
        .modal-actions button { flex: 1; }

        .output { margin-top: 20px; }
        .output h2 { margin-bottom: 10px; font-size: 14px; }
        .output-log {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            max-height: 200px;
            overflow-y: auto;
            color: var(--text);
        }
        .log-line { margin: 2px 0; }
        .log-success { color: var(--success); }
        .log-error { color: var(--danger); }
        .log-info { color: var(--accent); }
        .log-warning { color: var(--warning); }
    </style>
</head>
<body>
    <div class="container">
        <h1>401k Payroll Converter<span style="font-size:0.4em;font-weight:400;opacity:0.55;margin-left:10px;letter-spacing:0.05em;">v1.0</span></h1>

        <div class="layout">
            <div class="main">
                <div class="drop-zone" id="dropZone">
                    <p><strong>Drop HRPYDBRUNTRI xlsx file here</strong> or click to select</p>
                    <p style="font-size: 12px; margin-top: 6px; color: var(--text); opacity: 0.7;">Single payroll export</p>
                    <input type="file" id="fileInput" accept=".xlsx">
                </div>

                <div id="previewSection" style="display: none;">
                    <div class="controls">
                        <button class="btn-primary" id="convertBtn">Convert & Download</button>
                        <button class="btn-secondary" id="clearBtn">Clear</button>
                    </div>

                    <table class="employee-table" id="employeeTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Hours</th>
                                <th>Pre-Tax</th>
                                <th>Roth</th>
                                <th>Match</th>
                                <th style="width: 80px;">Status</th>
                            </tr>
                        </thead>
                        <tbody id="employeeBody"></tbody>
                    </table>
                </div>

                <div class="output">
                    <h2>Log</h2>
                    <div class="output-log" id="outputLog"></div>
                </div>
            </div>

            <div class="sidebar">
                <h2>⚙️ Roster</h2>

                <div class="config-group">
                    <label for="rosterFile">Upload CSV Roster</label>
                    <input type="file" id="rosterFile" accept=".csv">
                    <p style="font-size: 11px; margin-top: 4px; opacity: 0.7;">Or add employees below</p>
                    <div id="rosterStatus" style="font-size: 11px; margin-top: 6px; color: var(--accent);"></div>
                </div>

                <div class="config-group">
                    <label for="hoursInput">Default Hours</label>
                    <input type="number" id="hoursInput" value="0" step="0.01">
                </div>

                <div class="config-group">
                    <button class="btn-secondary" style="width: 100%; margin-top: 12px;" id="clearRosterBtn">Clear Roster from Storage</button>
                    <p style="font-size: 10px; margin-top: 6px; opacity: 0.6;">Roster is stored locally on this device</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for adding missing employees -->
    <div class="modal" id="addEmployeeModal">
        <div class="modal-content">
            <h2>Add Employee to Roster</h2>
            <p style="font-size: 12px; margin-bottom: 16px; opacity: 0.8;" id="addEmployeeNote"></p>

            <div class="modal-field">
                <label>Last Name</label>
                <input type="text" id="modal_lastName" readonly>
            </div>
            <div class="modal-field">
                <label>First Name</label>
                <input type="text" id="modal_firstName" readonly>
            </div>
            <div class="modal-field">
                <label>SSN</label>
                <input type="text" id="modal_ssn" placeholder="000-00-0000">
            </div>
            <div class="modal-field">
                <label>Middle Initial</label>
                <input type="text" id="modal_mi" maxlength="1" placeholder="X">
            </div>
            <div class="modal-field">
                <label>Date of Birth (MM/DD/YYYY)</label>
                <input type="text" id="modal_dob" placeholder="01/15/1990">
            </div>
            <div class="modal-field">
                <label>Date of Hire (MM/DD/YYYY)</label>
                <input type="text" id="modal_doh" placeholder="01/15/2022">
            </div>

            <div class="modal-actions">
                <button class="btn-primary" id="saveEmployeeBtn">Save & Continue</button>
                <button class="btn-secondary" id="skipEmployeeBtn">Skip This Employee</button>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let roster = new Map(); // key: "lastname|firstname" -> row data
        let currentPayroll = null;
        let currentPayDate = null;
        let pendingAdditions = [];
        let currentAdditionIndex = 0;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');
        const hoursInput = document.getElementById('hoursInput');
        const rosterFile = document.getElementById('rosterFile');
        const rosterStatus = document.getElementById('rosterStatus');
        const clearRosterBtn = document.getElementById('clearRosterBtn');
        const outputLog = document.getElementById('outputLog');
        const previewSection = document.getElementById('previewSection');
        const employeeTable = document.getElementById('employeeTable');
        const employeeBody = document.getElementById('employeeBody');
        const modal = document.getElementById('addEmployeeModal');

        // Load roster from localStorage on startup
        function loadRosterFromStorage() {
            const stored = localStorage.getItem('401k_roster');
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    roster.clear();
                    data.forEach(row => {
                        const key = row[1].toLowerCase() + '|' + row[2].split(' ')[0].toLowerCase();
                        roster.set(key, row);
                    });
                    rosterStatus.textContent = `✓ ${roster.size} employees in storage`;
                    rosterStatus.style.color = 'var(--success)';
                    log(`Roster loaded from storage: ${roster.size} employees`, 'info');
                } catch (e) {
                    log(`Error loading roster: ${e.message}`, 'error');
                }
            }
        }

        function saveRosterToStorage() {
            const data = Array.from(roster.values());
            localStorage.setItem('401k_roster', JSON.stringify(data));
        }

        loadRosterFromStorage();

        // Drag and drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.includes('HRPYDBRUNTRI') && file.name.endsWith('.xlsx')) {
                loadPayrollFile(file);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) loadPayrollFile(e.target.files[0]);
        });

        function log(msg, type = 'info') {
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = msg;
            outputLog.appendChild(line);
            outputLog.scrollTop = outputLog.scrollHeight;
        }

        function parseRosterCSV(csv) {
            const lines = csv.trim().split('\n');
            if (lines.length < 2) return;
            const header = lines[0].split(',').map(h => h.trim());
            const lnIdx = header.indexOf('Last Name');
            const fnIdx = header.indexOf('First Name');
            if (lnIdx === -1 || fnIdx === -1) return;

            roster.clear();
            for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].split(',').map(p => p.trim());
                if (parts.length > Math.max(lnIdx, fnIdx)) {
                    const ln = parts[lnIdx].toLowerCase();
                    const fn = (parts[fnIdx] || '').split(' ')[0].toLowerCase();
                    if (ln && fn) {
                        roster.set(ln + '|' + fn, parts);
                    }
                }
            }
            saveRosterToStorage();
            log(`Roster loaded: ${roster.size} employees`, 'success');
            rosterStatus.textContent = `✓ ${roster.size} employees loaded`;
            rosterStatus.style.color = 'var(--success)';
        }

        rosterFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const text = await file.text();
                parseRosterCSV(text);
            } catch (err) {
                log(`Error loading roster: ${err.message}`, 'error');
            }
        });

        clearRosterBtn.addEventListener('click', () => {
            roster.clear();
            localStorage.removeItem('401k_roster');
            rosterStatus.textContent = '';
            log('Roster cleared', 'info');
        });

        function findColumns(headers) {
            return {
                name: headers.findIndex(h => String(h).includes('Employee Name')),
                elec: headers.findIndex(h => String(h).includes('Elective Contrib')),
                roth: headers.findIndex(h => String(h).includes('Roth Contrib')),
                match: headers.findIndex(h => String(h).includes('Employer Matching Contrib')),
                loan: headers.findIndex(h => String(h).includes('Employee Loan Payment')),
                date: 2
            };
        }

        async function loadPayrollFile(file) {
            if (typeof XLSX === 'undefined') {
                log('ERROR: XLSX library not loaded', 'error');
                return;
            }

            try {
                outputLog.innerHTML = '';
                const ab = await file.arrayBuffer();
                const wb = XLSX.read(ab);
                const ws = wb.Sheets[wb.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                if (data.length < 2) throw new Error('Not enough rows');
                const headers = data[0];
                const cols = findColumns(headers);
                if (cols.name < 0 || cols.elec < 0) throw new Error('Column layout not found');

                // Extract pay date
                const dateStr = String(data[1][cols.date] || '');
                const dateMatch = dateStr.match(/(\d\d)\/(\d\d)\/(\d{4})/);
                if (!dateMatch) throw new Error('Pay date not found');
                const [_, m, d, y] = dateMatch;
                currentPayDate = `${parseInt(m)}_${d}_${y}`;

                // Extract employees
                currentPayroll = [];
                pendingAdditions = [];
                for (let j = 1; j < data.length; j++) {
                    const row = data[j];
                    const nm = String(row[cols.name] || '').trim();
                    if (!nm.includes(',')) continue;

                    const [ln, ...rest] = nm.split(',');
                    const fn = rest[0]?.trim()?.split(' ')[0] || '';
                    const key = ln.toLowerCase().trim() + '|' + fn.toLowerCase();

                    const val = (v) => {
                        if (isNaN(v) || v === '' || v === null) return '0';
                        const n = parseFloat(v);
                        return n === 0 ? '0' : n.toFixed(2);
                    };

                    currentPayroll.push({
                        name: nm,
                        key: key,
                        elec: val(row[cols.elec]),
                        roth: val(row[cols.roth]),
                        match: val(row[cols.match]),
                        loan: val(row[cols.loan]),
                        hours: hoursInput.value
                    });
                }

                // Check roster coverage
                for (let emp of currentPayroll) {
                    if (!roster.has(emp.key)) {
                        pendingAdditions.push(emp);
                    }
                }

                renderEmployeeTable();
                previewSection.style.display = 'block';

                if (pendingAdditions.length > 0) {
                    log(`⚠ ${pendingAdditions.length} employees not in roster`, 'warning');
                    showNextAddition();
                } else {
                    log(`✓ All ${currentPayroll.length} employees found in roster`, 'success');
                }
            } catch (e) {
                log(`Error loading file: ${e.message}`, 'error');
            }
        }

        function renderEmployeeTable() {
            employeeBody.innerHTML = currentPayroll.map((emp, i) => {
                const inRoster = roster.has(emp.key);
                return `
                    <tr>
                        <td>${emp.name}</td>
                        <td><input type="number" class="hours-input" data-index="${i}" value="${emp.hours}" step="0.25"></td>
                        <td>${emp.elec}</td>
                        <td>${emp.roth}</td>
                        <td>${emp.match}</td>
                        <td class="employee-status ${inRoster ? 'status-ok' : 'status-missing'}">
                            ${inRoster ? '✓' : '✗'}
                        </td>
                    </tr>
                `;
            }).join('');

            document.querySelectorAll('.hours-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    currentPayroll[idx].hours = e.target.value;
                });
            });
        }

        function showNextAddition() {
            if (currentAdditionIndex >= pendingAdditions.length) {
                log(`All employees processed`, 'success');
                currentAdditionIndex = 0;
                return;
            }

            const emp = pendingAdditions[currentAdditionIndex];
            const [ln, fn] = emp.name.split(',');
            document.getElementById('modal_lastName').value = ln.trim();
            document.getElementById('modal_firstName').value = fn?.trim() || '';
            document.getElementById('addEmployeeNote').textContent = `Employee ${currentAdditionIndex + 1} of ${pendingAdditions.length}`;
            document.getElementById('modal_ssn').value = '';
            document.getElementById('modal_mi').value = '';
            document.getElementById('modal_dob').value = '';
            document.getElementById('modal_doh').value = '';
            modal.classList.add('show');
        }

        document.getElementById('saveEmployeeBtn').addEventListener('click', () => {
            const emp = pendingAdditions[currentAdditionIndex];
            const ssn = document.getElementById('modal_ssn').value.trim();
            const mi = document.getElementById('modal_mi').value.trim();
            const dob = document.getElementById('modal_dob').value.trim();
            const doh = document.getElementById('modal_doh').value.trim();

            if (!ssn || !dob || !doh) {
                alert('Please fill in SSN, DOB, and DOH');
                return;
            }

            const [ln, fn] = emp.name.split(',');
            const row = [ssn, ln.trim(), fn?.trim() || '', mi, '', '', '', '', '', dob, doh, '', '', '0', emp.elec, emp.roth, emp.match, emp.loan];
            roster.set(emp.key, row);
            saveRosterToStorage();
            log(`✓ Added ${emp.name} to roster`, 'success');

            currentAdditionIndex++;
            modal.classList.remove('show');
            renderEmployeeTable();
            showNextAddition();
        });

        document.getElementById('skipEmployeeBtn').addEventListener('click', () => {
            const emp = pendingAdditions[currentAdditionIndex];
            log(`⊘ Skipped ${emp.name}`, 'info');
            currentAdditionIndex++;
            modal.classList.remove('show');
            showNextAddition();
        });

        clearBtn.addEventListener('click', () => {
            currentPayroll = null;
            currentPayDate = null;
            previewSection.style.display = 'none';
            fileInput.value = '';
            outputLog.innerHTML = '';
            log('Cleared', 'info');
        });

        convertBtn.addEventListener('click', () => {
            if (!currentPayroll || !roster.size) {
                log('ERROR: Load payroll and roster first', 'error');
                return;
            }

            const csvHeader = ['SSN','Last Name','First Name','MI','Address 1','Address 2','City','State','Zip','Date of Birth','Date of Hire','Date of Termination','Date of Rehire','Hours','Pre-Tax Deferrals','Roth Deferrals','Safe Harbor Match','Loan Payment'];
            const csvRows = [csvHeader];

            let skipped = 0;
            for (let emp of currentPayroll) {
                const rosterRow = roster.get(emp.key);
                if (!rosterRow) {
                    log(`  ⚠ Skipped ${emp.name} (not in roster)`, 'warning');
                    skipped++;
                    continue;
                }

                csvRows.push([
                    rosterRow[0], rosterRow[1], rosterRow[2], rosterRow[3], rosterRow[4] || '', rosterRow[5] || '',
                    rosterRow[6] || '', rosterRow[7] || '', rosterRow[8] || '', rosterRow[9] || '', rosterRow[10] || '',
                    rosterRow[11] || '', rosterRow[12] || '', emp.hours, emp.elec, emp.roth, emp.match, emp.loan
                ]);
            }

            const csvContent = csvRows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
            const filename = `${currentPayDate} 401k_Roth Upload.csv`;

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            log(`✓ Downloaded ${filename} (${csvRows.length - 1} employees${skipped ? `, ${skipped} skipped` : ''})`, 'success');
        });
    </script>
<script>const TOOL_KEY='401k-converter'; const TOOL_VERSION='1.0';</script>
<script src="version-check.js"></script>
</body>
</html>
